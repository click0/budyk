name: Release binaries

# Builds release tarballs for Linux (x86_64), FreeBSD amd64 (14.4, 15.1) and
# FreeBSD aarch64 (14.4, cross-compiled) when a semver tag is pushed, or on
# manual workflow_dispatch.
#
# Two variants per platform:
#   budyk-<version>-<platform>.tar.gz          Release, stripped (distribution).
#   budyk-<version>-<platform>-debug.tar.gz    RelWithDebInfo, unstripped —
#                                              same code-gen, full DWARF for gdb(1)
#                                              / lldb(1) post-mortem / crash-dump
#                                              analysis.
#
# Each tarball contains budyk + LICENSE + README.md + README.uk.md +
# CHANGELOG.md + docs/budyk.8 and is accompanied by a .sha256 sidecar in
# GNU format on every platform, so `sha256sum -c *.sha256` checks them all.
#
# Every binary is fully static (STATIC_LINK=ON, spec: single static binary
# with no runtime dependencies). The build fails if `file` doesn't report
# "statically linked", so a dynamic binary can't slip into a release.
#
# When the trigger is a tag, all tarballs and their SHA256 sums are attached
# to the GitHub Release named after the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, sha)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed by softprops/action-gh-release

jobs:
  # ----------------------------------------------------------------------
  # 1. Compute version string used in tarball names.
  # ----------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag:  ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: v
        run: |
          set -ex
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VER=$(sed -nE 's/.*project\(budyk VERSION ([0-9.]+).*/\1/p' CMakeLists.txt | head -1)
            VER="${VER}-${GITHUB_SHA::8}"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

  # ----------------------------------------------------------------------
  # 2. Linux x86_64 build — Release + RelWithDebInfo.
  # ----------------------------------------------------------------------
  linux:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Linux amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install toolchain and dependencies
        run: |
          set -ex
          .github/scripts/apt-install.sh \
            cmake g++ pkg-config \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev rpm

      - name: Build Release (stripped)
        run: |
          set -ex
          cmake -B build-release \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release -j"$(nproc)"
          strip build-release/src/budyk || true
          file build-release/src/budyk
          file build-release/src/budyk | grep -q "statically linked"

      - name: Build RelWithDebInfo (debug symbols kept)
        run: |
          set -ex
          cmake -B build-debug \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-debug -j"$(nproc)"
          # Do NOT strip — the debug tarball is for post-mortem / gdb.
          file build-debug/src/budyk
          file build-debug/src/budyk | grep -q "statically linked"

      - name: Stage tarballs
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -ex
          for variant in release debug; do
            if [ "$variant" = "release" ]; then
              SRC=build-release/src/budyk
              STAGE="budyk-${VER}-linux-amd64"
            else
              SRC=build-debug/src/budyk
              STAGE="budyk-${VER}-linux-amd64-debug"
            fi
            mkdir -p "$STAGE"
            cp "$SRC" "$STAGE/"
            cp LICENSE "$STAGE/"
            [ -f README.md    ] && cp README.md    "$STAGE/" || true
            [ -f README.uk.md ] && cp README.uk.md "$STAGE/" || true
            [ -f CHANGELOG.md ] && cp CHANGELOG.md "$STAGE/" || true
            mkdir -p "$STAGE/docs"
            [ -f docs/budyk.8 ] && cp docs/budyk.8 "$STAGE/docs/" || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          done
          ls -la budyk-*.tar.gz*

      # The .deb and .rpm of the release binary, installed, run and
      # removed before they go anywhere.
      - name: Linux packages
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -ex
          addons/linux/mkpkg.sh build-release/src/budyk "$VER" .
          for f in budyk_*_amd64.deb budyk-*.x86_64.rpm; do
            sha256sum "$f" > "$f.sha256"
          done
          sudo addons/linux/test-packages.sh . "$VER"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: budyk-linux-amd64
          path: |
            budyk-*-linux-amd64.tar.gz
            budyk-*-linux-amd64.tar.gz.sha256
            budyk-*-linux-amd64-debug.tar.gz
            budyk-*-linux-amd64-debug.tar.gz.sha256
            budyk_*_amd64.deb
            budyk_*_amd64.deb.sha256
            budyk-*.x86_64.rpm
            budyk-*.x86_64.rpm.sha256
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------------
  # 3. FreeBSD amd64 matrix (14.4 / 15.1, the oldest supported release
  #    of each branch) — Release + RelWithDebInfo.
  #    Both variants built inside the same VM run to avoid paying the
  #    cross-platform-actions boot cost twice.
  # ----------------------------------------------------------------------
  freebsd:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        freebsd-version: ['14.4', '15.1']
    name: FreeBSD ${{ matrix.freebsd-version }} amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build on FreeBSD
        uses: cross-platform-actions/action@v1.6.0
        timeout-minutes: 65
        env:
          VER: ${{ needs.meta.outputs.version }}
          FBSD: ${{ matrix.freebsd-version }}
        with:
          operating_system: freebsd
          version: ${{ matrix.freebsd-version }}
          environment_variables: VER FBSD
          shell: sh
          memory: 6G
          cpu_count: 3
          run: |
            set -ex

            echo "::group::Install dependencies"
            sudo pkg install -y cmake pkgconf lua54 libyaml libargon2
            echo "::endgroup::"

            NCPU=$(sysctl -n hw.ncpu)
            JOBS=$(( NCPU < 3 ? NCPU : 2 ))

            echo "::group::Build Release (stripped)"
            cmake -B build-release \
              -DBUDYK_PLATFORM=freebsd \
              -DSTATIC_LINK=ON \
              -DBUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build-release -j"$JOBS"
            strip build-release/src/budyk || true
            file build-release/src/budyk
            file build-release/src/budyk | grep -q "statically linked"
            echo "::endgroup::"

            echo "::group::Build RelWithDebInfo (debug symbols kept)"
            cmake -B build-debug \
              -DBUDYK_PLATFORM=freebsd \
              -DSTATIC_LINK=ON \
              -DBUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
            cmake --build build-debug -j"$JOBS"
            # Do NOT strip.
            file build-debug/src/budyk
            file build-debug/src/budyk | grep -q "statically linked"
            echo "::endgroup::"

            echo "::group::Stage tarballs"
            for variant in release debug; do
              if [ "$variant" = "release" ]; then
                SRC=build-release/src/budyk
                STAGE="budyk-${VER}-freebsd${FBSD}-amd64"
              else
                SRC=build-debug/src/budyk
                STAGE="budyk-${VER}-freebsd${FBSD}-amd64-debug"
              fi
              mkdir -p "$STAGE"
              cp "$SRC" "$STAGE/"
              cp LICENSE "$STAGE/"
              [ -f README.md    ] && cp README.md    "$STAGE/" || true
              [ -f README.uk.md ] && cp README.uk.md "$STAGE/" || true
              [ -f CHANGELOG.md ] && cp CHANGELOG.md "$STAGE/" || true
              mkdir -p "$STAGE/docs"
              [ -f docs/budyk.8 ] && cp docs/budyk.8 "$STAGE/docs/" || true
              tar -czf "${STAGE}.tar.gz" "$STAGE"
              # GNU format ("<hash>  <file>"), the same as the Linux
              # sidecars. `sha256 -r` writes one space, and GNU
              # `sha256sum -c` given both formats at once misreads the
              # two-space lines.
              printf '%s  %s\n' "$(sha256 -q "${STAGE}.tar.gz")" "${STAGE}.tar.gz" \
                > "${STAGE}.tar.gz.sha256"
            done
            ls -la budyk-*.tar.gz*
            echo "::endgroup::"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: budyk-freebsd-${{ matrix.freebsd-version }}-amd64
          path: |
            budyk-*-freebsd${{ matrix.freebsd-version }}-amd64.tar.gz
            budyk-*-freebsd${{ matrix.freebsd-version }}-amd64.tar.gz.sha256
            budyk-*-freebsd${{ matrix.freebsd-version }}-amd64-debug.tar.gz
            budyk-*-freebsd${{ matrix.freebsd-version }}-amd64-debug.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------------
  # 4. FreeBSD aarch64 — Release + RelWithDebInfo, cross-compiled on this
  #    Linux host against the 14.4 sysroot (cmake/toolchains/), then run
  #    in an arm64 FreeBSD 14.4 VM (emulated): `budyk version` and the
  #    smoke scripts, with the release binary.
  # ----------------------------------------------------------------------
  freebsd-aarch64:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: FreeBSD 14.4 aarch64
    env:
      FBSD: '14.4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install toolchain
        run: |
          set -ex
          .github/scripts/apt-install.sh cmake clang lld llvm zstd
          clang --version | head -1

      - name: Sysroot (base.txz and packages, checksums and signature checked)
        run: cmake/toolchains/freebsd-sysroot.sh "$FBSD" aarch64 "$RUNNER_TEMP/sysroot"

      - name: Build Release (stripped) and RelWithDebInfo (debug symbols kept)
        run: |
          set -ex
          for type in Release RelWithDebInfo; do
            cmake -B "build-$type" \
              --toolchain cmake/toolchains/freebsd-aarch64.cmake \
              -DFREEBSD_SYSROOT="$RUNNER_TEMP/sysroot" \
              -DSTATIC_LINK=ON \
              -DBUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE="$type"
            cmake --build "build-$type" -j"$(nproc)"
          done
          llvm-strip build-Release/src/budyk
          for b in build-Release/src/budyk build-RelWithDebInfo/src/budyk; do
            file "$b"
            file "$b" | grep "ARM aarch64" | grep "statically linked" \
              | grep -q "for FreeBSD $FBSD"
          done

      - name: Stage tarballs
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -ex
          for variant in release debug; do
            if [ "$variant" = "release" ]; then
              SRC=build-Release/src/budyk
              STAGE="budyk-${VER}-freebsd${FBSD}-aarch64"
            else
              SRC=build-RelWithDebInfo/src/budyk
              STAGE="budyk-${VER}-freebsd${FBSD}-aarch64-debug"
            fi
            mkdir -p "$STAGE"
            cp "$SRC" "$STAGE/"
            cp LICENSE "$STAGE/"
            [ -f README.md    ] && cp README.md    "$STAGE/" || true
            [ -f README.uk.md ] && cp README.uk.md "$STAGE/" || true
            [ -f CHANGELOG.md ] && cp CHANGELOG.md "$STAGE/" || true
            mkdir -p "$STAGE/docs"
            [ -f docs/budyk.8 ] && cp docs/budyk.8 "$STAGE/docs/" || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          done
          cp build-Release/src/budyk budyk-aarch64
          rm -rf build-Release build-RelWithDebInfo
          ls -la budyk-*.tar.gz*

      # The build trees are gone, so the VM gets the sources, the tarballs
      # and the binary under test only.
      - name: Smoke tests on FreeBSD arm64
        uses: cross-platform-actions/action@v1.6.0
        timeout-minutes: 75
        with:
          operating_system: freebsd
          architecture: arm64
          version: '14.4'
          shell: sh
          memory: 4G
          cpu_count: 3
          run: |
            set -ex
            uname -a
            sudo pkg install -y curl python3
            file budyk-aarch64
            ./budyk-aarch64 version

            # How long the daemon takes to answer on the emulated CPU.
            d=$(mktemp -d)
            printf 'data_dir: %s\nlisten: 127.0.0.1\nport: 18999\n' "$d" > "$d/config.yaml"
            t0=$(date +%s)
            ./budyk-aarch64 serve --config "$d/config.yaml" > "$d/log" 2>&1 &
            pid=$!
            until curl -s -o /dev/null http://127.0.0.1:18999/api/health; do
              [ $(( $(date +%s) - t0 )) -lt 300 ] || break
              sleep 1
            done
            echo "the daemon answered after $(( $(date +%s) - t0 )) s"
            curl -s http://127.0.0.1:18999/api/health
            cat "$d/log"
            kill -TERM "$pid"
            wait "$pid" || true

            export SMOKE_START_WAIT=120
            failed=
            for t in serve crash warm_grace escalate fsck modes; do
              tests/smoke/$t.sh ./budyk-aarch64 || failed="$failed $t"
            done
            [ -z "$failed" ] || { echo "FAIL:$failed"; exit 1; }

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: budyk-freebsd-14.4-aarch64
          path: |
            budyk-*-freebsd14.4-aarch64.tar.gz
            budyk-*-freebsd14.4-aarch64.tar.gz.sha256
            budyk-*-freebsd14.4-aarch64-debug.tar.gz
            budyk-*-freebsd14.4-aarch64-debug.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------------
  # 5. Verify all checksums in one run, the way a user would with
  #    `sha256sum -c *.sha256`. A sidecar in a format that run misreads
  #    fails here — on the dry run too, which skips publish.
  # ----------------------------------------------------------------------
  checksums:
    needs: [linux, freebsd, freebsd-aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: budyk-*
          merge-multiple: true

      - name: sha256sum -c *.sha256
        working-directory: dist
        run: |
          set -ex
          ls -la
          cat ./*.sha256
          sha256sum -c ./*.sha256

  # ----------------------------------------------------------------------
  # 6. Publish to GitHub Release when triggered by a tag push.
  # ----------------------------------------------------------------------
  publish:
    needs: [meta, linux, freebsd, freebsd-aarch64, checksums]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: budyk-*
          merge-multiple: true

      - name: Show collected assets
        run: |
          set -ex
          ls -la dist/
          cat dist/*.sha256

      # Release notes are this version's CHANGELOG section only: from its
      # "## [X.Y.Z]" heading up to the next "## [" heading, without the
      # "[X.Y.Z]: <url>" link line. A tag with no section fails the run
      # rather than publishing a release without notes.
      - name: Extract release notes from CHANGELOG
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          awk -v ver="$VER" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found && index($0, "[" ver "]: ") != 1 { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VER]' section"
            exit 1
          fi
          wc -l release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: budyk ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: ${{ github.workspace }}/release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
          fail_on_unmatched_files: true
