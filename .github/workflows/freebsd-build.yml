name: FreeBSD Build (full)

# Full build + ctest on a FreeBSD matrix: the port's configuration
# (shared, as addons/freebsd/Makefile builds it) and the release one
# (static, as release.yml ships it), plus the smoke scripts against the
# static binary and, on 15.1, against the amd64 binary cross-compiled on
# the Linux host (cmake/toolchains/).
# Runs on:
#   * push to main       (gates mainline);
#   * pull_request → main (gates merge);
#   * weekly cron         (catches bit-rot from pkg / base updates);
#   * workflow_dispatch   (manual).
#
# Fast smoke-check for feature branches lives in freebsd-build-lite.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/freebsd-build-lite.yml'
      - '.github/workflows/linux-build.yml'
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 04:00 UTC — catches regressions from pkg updates.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        freebsd-version: ['14.4', '15.1']
    name: FreeBSD ${{ matrix.freebsd-version }} full
    steps:
      - uses: actions/checkout@v4

      # The amd64 binary cross-compiled on this Linux host against the
      # sysroot of 14.4, the oldest supported 14.x (cmake/toolchains/), for
      # the smoke scripts on 15.1 below: what an upgraded host runs. The
      # sysroot and the build tree stay out of the directory the VM gets.
      - name: Cross-compile for FreeBSD amd64 on the Linux host
        if: matrix.freebsd-version == '15.1'
        run: |
          set -ex
          .github/scripts/apt-install.sh cmake clang lld llvm
          cmake/toolchains/freebsd-sysroot.sh 14.4 amd64 "$RUNNER_TEMP/sysroot"
          cmake -B "$RUNNER_TEMP/build-cross" \
            --toolchain cmake/toolchains/freebsd-amd64.cmake \
            -DFREEBSD_SYSROOT="$RUNNER_TEMP/sysroot" \
            -DBUILD_TESTS=OFF \
            -DENABLE_WERROR=ON
          cmake --build "$RUNNER_TEMP/build-cross" -j"$(nproc)"
          cp "$RUNNER_TEMP/build-cross/src/budyk" budyk-cross
          file budyk-cross

      - name: Build + test on FreeBSD
        uses: cross-platform-actions/action@v1.6.0
        timeout-minutes: 45
        with:
          operating_system: freebsd
          version: ${{ matrix.freebsd-version }}
          shell: sh
          memory: 6G
          cpu_count: 3
          run: |
            set -ex

            echo "::group::Install dependencies"
            # curl and python3: the smoke scripts' HTTP and WebSocket clients.
            sudo pkg install -y cmake pkgconf lua54 libyaml libargon2 curl python3
            echo "::endgroup::"

            echo "::group::System info"
            uname -a
            c++ --version
            NCPU=$(sysctl -n hw.ncpu)
            JOBS=$(( NCPU < 3 ? NCPU : 2 ))
            echo "ncpu=$NCPU jobs=$JOBS"
            df -h
            echo "::endgroup::"

            echo "::group::Configure"
            cmake -B build \
              -DBUDYK_PLATFORM=freebsd \
              -DSTATIC_LINK=OFF \
              -DBUILD_TESTS=ON \
              -DENABLE_WERROR=ON
            echo "::endgroup::"

            echo "::group::Build"
            cmake --build build -j"$JOBS"
            ls -la build/src/budyk || true
            file build/src/budyk || true
            echo "::endgroup::"

            echo "::group::Run ctest"
            ctest --test-dir build --output-on-failure
            echo "::endgroup::"

            echo "::group::Static build + ctest (the release configuration)"
            cmake -B build-static \
              -DBUDYK_PLATFORM=freebsd \
              -DSTATIC_LINK=ON \
              -DBUILD_TESTS=ON \
              -DENABLE_WERROR=ON
            cmake --build build-static -j"$JOBS"
            file build-static/src/budyk
            file build-static/src/budyk | grep -q "statically linked"
            build-static/src/budyk version
            ctest --test-dir build-static --output-on-failure
            echo "::endgroup::"

            echo "::group::Smoke tests (static binary)"
            tests/smoke/serve.sh build-static/src/budyk
            tests/smoke/crash.sh build-static/src/budyk
            tests/smoke/warm_grace.sh build-static/src/budyk
            tests/smoke/escalate.sh build-static/src/budyk
            tests/smoke/fsck.sh build-static/src/budyk
            tests/smoke/modes.sh build-static/src/budyk
            tests/smoke/resources.sh build-static/src/budyk
            echo "::endgroup::"

            if [ -e budyk-cross ]; then
              echo "::group::Smoke tests (the binary cross-compiled on Linux for 14.4)"
              file budyk-cross
              ./budyk-cross version
              tests/smoke/serve.sh ./budyk-cross
              tests/smoke/crash.sh ./budyk-cross
              tests/smoke/warm_grace.sh ./budyk-cross
              tests/smoke/escalate.sh ./budyk-cross
              tests/smoke/fsck.sh ./budyk-cross
              tests/smoke/modes.sh ./budyk-cross
              echo "::endgroup::"
            fi

            echo "::group::Disk usage"
            df -h
            du -sh build 2>/dev/null || true
            echo "::endgroup::"

      - name: Upload budyk binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: budyk-${{ matrix.freebsd-version }}
          path: |
            build/src/budyk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.freebsd-version }}
          path: |
            build/Testing/
            build-static/Testing/
          if-no-files-found: ignore
          retention-days: 14
