name: Linux Build

# Fast feedback loop: configure + build + ctest on an Ubuntu runner.
# No FreeBSD VM. Core/codec/hot_buffer/etc. are pure C++17 and compile on
# Linux via -DBUDYK_PLATFORM=linux.
#
# This complements the FreeBSD workflows — it is the cheapest signal and
# runs on every push/PR.
#
# Packages come from .github/scripts/apt-install.sh, which puts a time
# limit and three attempts on apt-get update and install: a mirror that
# stops answering otherwise holds the job until its timeout-minutes.

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/freebsd-build.yml'
      - '.github/workflows/freebsd-build-lite.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # static — the project default (STATIC_LINK=ON): configured with no
        #          -DSTATIC_LINK flag so the real default is what gets built.
        #          Nothing else in CI builds it, which is how it once rotted.
        # shared — STATIC_LINK=OFF, the mode the FreeBSD and release jobs use.
        link: [static, shared]
    name: Linux build + ctest (${{ matrix.link }})
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          .github/scripts/apt-install.sh \
            cmake g++ pkg-config \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev
          cmake --version | head -1
          g++ --version | head -1

      - name: Configure
        run: |
          set -ex
          LINK_FLAGS=""
          if [ "${{ matrix.link }}" = "shared" ]; then
            LINK_FLAGS="-DSTATIC_LINK=OFF"
          fi
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            $LINK_FLAGS \
            -DBUILD_TESTS=ON \
            -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Check binary link mode
        run: |
          set -ex
          file build/src/budyk
          if [ "${{ matrix.link }}" = "static" ]; then
            file build/src/budyk | grep -q "statically linked"
          fi

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

      # Spec §5 items 2-6 on the release configuration: RSS, CPU and disk
      # idle and with a client, L1 -> L3, catch-up, the binary's size.
      - name: Resource figures (spec §5)
        if: matrix.link == 'static'
        run: tests/smoke/resources.sh build/src/budyk

      # The .deb and .rpm of the static binary: installed, run as budyk
      # (under systemd here) and removed; the .rpm in a Fedora container.
      - name: Linux packages (deb, rpm)
        if: matrix.link == 'static'
        run: |
          set -ex
          .github/scripts/apt-install.sh rpm
          VER=$(build/src/budyk version | cut -d' ' -f2)
          addons/linux/mkpkg.sh build/src/budyk "$VER" packages
          sudo addons/linux/test-packages.sh packages "$VER"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux-${{ matrix.link }}
          path: build/Testing/
          if-no-files-found: ignore
          retention-days: 7

  # Cross-compiled for FreeBSD with clang and lld (cmake/toolchains/),
  # against the sysroot of 14.4, the oldest supported 14.x: the static
  # release configuration, tests included, for amd64 and aarch64. The
  # FreeBSD workflow runs the amd64 binary on FreeBSD 15.1; the aarch64
  # binary and unit tests run here, in an emulated arm64 FreeBSD 14.4.
  freebsd-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    name: FreeBSD cross (${{ matrix.arch }})
    env:
      FREEBSD_VERSION: '14.4'
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -ex
          .github/scripts/apt-install.sh cmake clang lld llvm zstd
          clang --version | head -1

      - name: Sysroot (base.txz and packages, checksums and signature checked)
        run: cmake/toolchains/freebsd-sysroot.sh "$FREEBSD_VERSION" ${{ matrix.arch }} "$RUNNER_TEMP/sysroot"

      - name: Configure and build
        run: |
          set -ex
          cmake -B "$RUNNER_TEMP/build" \
            --toolchain cmake/toolchains/freebsd-${{ matrix.arch }}.cmake \
            -DFREEBSD_SYSROOT="$RUNNER_TEMP/sysroot" \
            -DBUILD_TESTS=ON \
            -DENABLE_WERROR=ON
          cmake --build "$RUNNER_TEMP/build" -j"$(nproc)"

      - name: Check the binary
        run: |
          set -ex
          case "${{ matrix.arch }}" in
            amd64)   machine=x86-64 ;;
            aarch64) machine="ARM aarch64" ;;
          esac
          file "$RUNNER_TEMP/build/src/budyk"
          file "$RUNNER_TEMP/build/src/budyk" | grep "$machine" | grep "(FreeBSD)" \
            | grep "statically linked" | grep -q "for FreeBSD $FREEBSD_VERSION"

      # x86 forgives an unaligned access and arm64 does not (SIGBUS), and
      # nothing else in CI runs on arm64: the unit tests and the smoke
      # scripts, on FreeBSD arm64. The VM gets the sources and arm/ (the
      # build tree is outside the workspace).
      - name: Stage the aarch64 binary and tests for the VM
        if: matrix.arch == 'aarch64'
        run: |
          set -ex
          mkdir arm
          cp "$RUNNER_TEMP/build/src/budyk" arm/
          cp "$RUNNER_TEMP"/build/tests/test_* arm/

      - name: Unit and smoke tests on FreeBSD arm64 (emulated)
        if: matrix.arch == 'aarch64'
        uses: cross-platform-actions/action@v1.6.0
        timeout-minutes: 25
        with:
          operating_system: freebsd
          architecture: arm64
          version: '14.4'
          shell: sh
          memory: 4G
          cpu_count: 3
          run: |
            set -e
            uname -a
            sudo pkg install -y curl python3
            failed=
            for t in arm/test_*; do
              case "$t" in
                */test_rule_files) arg=rules ;;
                */test_rule_perf)  arg=0 ;;   # emulated: the time is only reported
                *)                 arg= ;;
              esac
              if "$t" $arg > "$t.log" 2>&1; then
                echo "ok   $t"
              else
                echo "FAIL $t"; tail -20 "$t.log"; failed="$failed $t"
              fi
            done
            [ -z "$failed" ] || { echo "FAIL:$failed"; exit 1; }
            tests/smoke/serve.sh arm/budyk
            tests/smoke/crash.sh arm/budyk
            tests/smoke/warm_grace.sh arm/budyk
            tests/smoke/escalate.sh arm/budyk
            tests/smoke/fsck.sh arm/budyk
            tests/smoke/modes.sh arm/budyk
            tests/smoke/crosscheck.sh arm/budyk

      # The static-analysis job leaves out the FreeBSD collectors and sees
      # only the Linux side of every #ifdef; with the sysroot's headers,
      # clang-tidy checks the FreeBSD side.
      - name: clang-tidy, FreeBSD target
        if: matrix.arch == 'amd64'
        run: |
          set -e
          .github/scripts/apt-install.sh clang-tidy
          cmake -B build-tidy \
            --toolchain cmake/toolchains/freebsd-amd64.cmake \
            -DFREEBSD_SYSROOT="$RUNNER_TEMP/sysroot" \
            -DSTATIC_LINK=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          git ls-files 'src/*.cpp' 'src/*.c' | grep -v '/linux/' \
            | xargs -P "$(nproc)" -n 8 clang-tidy -p build-tidy --quiet

  # ASan + UBSan: every unit test, plus a smoke test of the running daemon
  # (HTTP, WebSocket, collection loop, SIGHUP/SIGTERM) since main.cpp has
  # no unit tests, and a crash test (SIGKILL, restart on the same rings,
  # at most one record lost). Any report aborts the process, so it fails
  # the job.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Linux ASan + UBSan
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          .github/scripts/apt-install.sh \
            cmake g++ pkg-config python3 curl \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev

      - name: Configure
        run: |
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=OFF \
            -DENABLE_SANITIZERS=ON \
            -DBUILD_TESTS=ON \
            -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test the daemon
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/serve.sh build/src/budyk

      - name: Crash test (SIGKILL + restart on the same rings)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/crash.sh build/src/budyk

      - name: Hot buffer warm_grace
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/warm_grace.sh build/src/budyk

      - name: L2 -> L3 escalation on a sustained anomaly
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/escalate.sh build/src/budyk

      - name: fsck, start-up recovery, the data_dir lock
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/fsck.sh build/src/budyk

      - name: Per-level metric sets, collection.mode
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/modes.sh build/src/budyk

      - name: The readings against the system's own tools
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/crosscheck.sh build/src/budyk

      # Rings written by the v0.6.4 release (270-byte records) must be
      # converted when this build starts on them. The release binary is
      # pinned by its SHA-256.
      - name: Rings of v0.6.4 converted on start
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/old.tar.gz" \
            https://github.com/click0/budyk/releases/download/v0.6.4/budyk-0.6.4-linux-amd64.tar.gz
          echo "19cf8453d2ab70678f202158e3d1718e3cb6ed44bd4e70521c06bcb92f6e25bd  $RUNNER_TEMP/old.tar.gz" \
            | sha256sum -c -
          tar xzf "$RUNNER_TEMP/old.tar.gz" -C "$RUNNER_TEMP"
          tests/smoke/upgrade.sh build/src/budyk "$RUNNER_TEMP/budyk-0.6.4-linux-amd64/budyk"

      # And the v0.7.0 release's (502-byte records, codec v8).
      - name: Rings of v0.7.0 converted on start
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/old070.tar.gz" \
            https://github.com/click0/budyk/releases/download/v0.7.0/budyk-0.7.0-linux-amd64.tar.gz
          echo "d2525b3eb154ecb527c2f49723d5a91312b51e486bef2c3b2d56e6ece65db4ed  $RUNNER_TEMP/old070.tar.gz" \
            | sha256sum -c -
          tar xzf "$RUNNER_TEMP/old070.tar.gz" -C "$RUNNER_TEMP"
          tests/smoke/upgrade.sh build/src/budyk "$RUNNER_TEMP/budyk-0.7.0-linux-amd64/budyk" 18786

  # ThreadSanitizer: the collector tick, the HTTP thread and the Workers
  # share the hot buffer, the rings, the hub and the session store. Every
  # unit test plus the serve smoke test; any report fails the job.
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Linux TSan
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          .github/scripts/apt-install.sh \
            cmake g++ pkg-config python3 curl \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev

      - name: Configure
        run: |
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=OFF \
            -DENABLE_TSAN=ON \
            -DBUILD_TESTS=ON \
            -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test the daemon
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: tests/smoke/serve.sh build/src/budyk

  # cppcheck + clang-tidy (checks in .clang-tidy). Any finding fails the
  # job; suppress a false positive inline with a comment saying why.
  # The whitespace rules from .editorconfig are checked here too, and
  # the Doxygen API reference is built (no warnings) and kept.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Linux cppcheck + clang-tidy
    steps:
      - uses: actions/checkout@v4

      - name: Whitespace (trailing blanks, tabs, CR, final newline)
        run: tests/check_whitespace.sh

      - name: Install tools and dependencies
        run: |
          set -ex
          .github/scripts/apt-install.sh \
            cmake g++ pkg-config cppcheck clang-tidy \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev
          cppcheck --version
          clang-tidy --version | head -2

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr \
            --std=c++17 -I src -D BUDYK_LINUX --error-exitcode=1 --quiet src

      - name: clang-tidy
        run: |
          set -e
          cmake -B build -DBUDYK_PLATFORM=linux -DSTATIC_LINK=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # FreeBSD collectors need FreeBSD headers; they're built and
          # tested by the FreeBSD workflows instead.
          git ls-files 'src/*.cpp' 'src/*.c' | grep -v '/freebsd/' \
            | xargs clang-tidy -p build --quiet

      # The API reference of the headers (cmake/docs.cmake): any Doxygen
      # warning fails the target.
      - name: Doxygen (no warnings)
        run: |
          set -e
          .github/scripts/apt-install.sh doxygen
          doxygen --version
          cmake -B build
          cmake --build build --target docs

      - name: Upload the API reference
        uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: build/docs/html/
          retention-days: 14

  # Line coverage (gcov/lcov) over the unit tests plus the serve smoke
  # test, which is what covers main.cpp. Spec §5 item 10: core/ and
  # storage/ must stay at >= 85%; the job fails below that. The per-module
  # table goes to the job summary; coverage.info is kept as an artifact.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Linux coverage
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          .github/scripts/apt-install.sh \
            cmake g++ pkg-config python3 curl lcov \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev

      - name: Configure
        run: |
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=OFF \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS=--coverage \
            -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest and the smoke tests
        run: |
          ctest --test-dir build --output-on-failure
          tests/smoke/serve.sh build/src/budyk
          tests/smoke/crash.sh build/src/budyk
          tests/smoke/warm_grace.sh build/src/budyk
          tests/smoke/escalate.sh build/src/budyk
          tests/smoke/fsck.sh build/src/budyk
          tests/smoke/modes.sh build/src/budyk
          tests/smoke/crosscheck.sh build/src/budyk

      - name: Coverage report (core/ and storage/ >= 85%)
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --ignore-errors mismatch,inconsistent,unused,gcov,empty
          tests/coverage_report.py coverage.info --min core=85 --min storage=85

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage.info
          if-no-files-found: ignore
          retention-days: 14
