name: Linux Build

# Fast feedback loop: configure + build + ctest on an Ubuntu runner.
# No FreeBSD VM. Core/codec/hot_buffer/etc. are pure C++17 and compile on
# Linux via -DBUDYK_PLATFORM=linux.
#
# This complements the FreeBSD workflows — it is the cheapest signal and
# runs on every push/PR.
#
# apt runs with a 30 s per-request timeout and three retries
# (80-ci-timeouts): a mirror that stops answering otherwise holds the job
# until its timeout-minutes.

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/freebsd-build.yml'
      - '.github/workflows/freebsd-build-lite.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # static — the project default (STATIC_LINK=ON): configured with no
        #          -DSTATIC_LINK flag so the real default is what gets built.
        #          Nothing else in CI builds it, which is how it once rotted.
        # shared — STATIC_LINK=OFF, the mode the FreeBSD and release jobs use.
        link: [static, shared]
    name: Linux build + ctest (${{ matrix.link }})
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev
          cmake --version | head -1
          g++ --version | head -1

      - name: Configure
        run: |
          set -ex
          LINK_FLAGS=""
          if [ "${{ matrix.link }}" = "shared" ]; then
            LINK_FLAGS="-DSTATIC_LINK=OFF"
          fi
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            $LINK_FLAGS \
            -DBUILD_TESTS=ON \
            -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Check binary link mode
        run: |
          set -ex
          file build/src/budyk
          if [ "${{ matrix.link }}" = "static" ]; then
            file build/src/budyk | grep -q "statically linked"
          fi

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-linux-${{ matrix.link }}
          path: build/Testing/
          if-no-files-found: ignore
          retention-days: 7

  # ASan + UBSan: every unit test, plus a smoke test of the running daemon
  # (HTTP, WebSocket, collection loop, SIGHUP/SIGTERM) since main.cpp has
  # no unit tests, and a crash test (SIGKILL, restart on the same rings,
  # at most one record lost). Any report aborts the process, so it fails
  # the job.
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Linux ASan + UBSan
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config python3 curl \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev

      - name: Configure
        run: |
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=OFF \
            -DENABLE_SANITIZERS=ON \
            -DBUILD_TESTS=ON \
            -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test the daemon
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/serve.sh build/src/budyk

      - name: Crash test (SIGKILL + restart on the same rings)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/crash.sh build/src/budyk

      - name: Hot buffer warm_grace
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: tests/smoke/warm_grace.sh build/src/budyk

  # ThreadSanitizer: the collector tick, the HTTP thread and the Workers
  # share the hot buffer, the rings, the hub and the session store. Every
  # unit test plus the serve smoke test; any report fails the job.
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Linux TSan
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config python3 curl \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev

      - name: Configure
        run: |
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=OFF \
            -DENABLE_TSAN=ON \
            -DBUILD_TESTS=ON \
            -DENABLE_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test the daemon
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: tests/smoke/serve.sh build/src/budyk

  # cppcheck + clang-tidy (checks in .clang-tidy). Any finding fails the
  # job; suppress a false positive inline with a comment saying why.
  # The whitespace rules from .editorconfig are checked here too.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Linux cppcheck + clang-tidy
    steps:
      - uses: actions/checkout@v4

      - name: Whitespace (trailing blanks, tabs, CR, final newline)
        run: tests/check_whitespace.sh

      - name: Install tools and dependencies
        run: |
          set -ex
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config cppcheck clang-tidy \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev
          cppcheck --version
          clang-tidy --version | head -2

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr \
            --std=c++17 -I src -D BUDYK_LINUX --error-exitcode=1 --quiet src

      - name: clang-tidy
        run: |
          set -e
          cmake -B build -DBUDYK_PLATFORM=linux -DSTATIC_LINK=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # FreeBSD collectors need FreeBSD headers; they're built and
          # tested by the FreeBSD workflows instead.
          git ls-files 'src/*.cpp' 'src/*.c' | grep -v '/freebsd/' \
            | xargs clang-tidy -p build --quiet

  # Line coverage (gcov/lcov) over the unit tests plus the serve smoke
  # test, which is what covers main.cpp. Spec §5 item 10: core/ and
  # storage/ must stay at >= 85%; the job fails below that. The per-module
  # table goes to the job summary; coverage.info is kept as an artifact.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Linux coverage
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and dependencies
        run: |
          set -ex
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config python3 curl lcov \
            liblua5.4-dev libyaml-dev libargon2-dev libncurses-dev

      - name: Configure
        run: |
          cmake -B build \
            -DBUDYK_PLATFORM=linux \
            -DSTATIC_LINK=OFF \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS=--coverage \
            -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run ctest and the smoke tests
        run: |
          ctest --test-dir build --output-on-failure
          tests/smoke/serve.sh build/src/budyk
          tests/smoke/crash.sh build/src/budyk
          tests/smoke/warm_grace.sh build/src/budyk

      - name: Coverage report (core/ and storage/ >= 85%)
        run: |
          lcov --capture --directory build --output-file coverage.info \
            --ignore-errors mismatch,inconsistent,unused,gcov,empty
          tests/coverage_report.py coverage.info --min core=85 --min storage=85

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage.info
          if-no-files-found: ignore
          retention-days: 14
