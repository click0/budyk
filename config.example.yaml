# budyk — example configuration
# https://github.com/click0/budyk
#
# Copy to /usr/local/etc/budyk/config.yaml (FreeBSD) or
# /etc/budyk/config.yaml (Linux) and edit. Pass an alternative
# path via `budyk serve --config /path/to/config.yaml`.

# ---- Server ---------------------------------------------------------------
listen: "127.0.0.1"        # 0.0.0.0 to bind every interface
port: 8080
data_dir: "/var/db/budyk"  # ring files + (future) exports

# ---- Collection cadence (spec §3.3) --------------------------------------
collection:
  l1:
    interval: 300          # heartbeat — seconds
  l2:
    interval: 30
    always_on: false       # `true` keeps the watchful tier alive without
                           # an active client / anomaly
    hysteresis: 300        # seconds before stepping down a level
    escalation_thresholds:
      load_1m: 4.0
      cpu_percent: 85
      swap_used_percent: 50
  l3:
    interval: 1            # active — seconds
    grace_period: 60       # how long to keep L3 after the last client
                           # disconnects
  hot_buffer:
    capacity: 300          # records held in RAM for WS catch-up
    warm_grace: 60         # seconds

  # Custom levels, in addition to L1/L2/L3 (at most 16). The active level
  # with the highest priority wins; built-ins are L1 = 0 (always active),
  # L2 = 20, L3 = 30. On a tie the shorter interval wins.
  #   name        required  letters, digits, '_' or '-' (not L1/L2/L3)
  #   interval    required  seconds between ticks; fractions allowed (0.1 .. 86400)
  #   priority    required  integer
  #   when        optional  Lua expression over the metric globals, like a
  #                         YAML rule's `when`; the level is active while true
  #   hold        optional  seconds to stay active after `when` was last true (0)
  #   storage_mb  optional  size of the level's ring file, level-<name>.ring (50)
  # A rule can also switch a level on: escalate("burst", 120).
  # levels:
  #   - name: burst           # 2 Hz while the box is under real pressure
  #     interval: 0.5
  #     priority: 40          # above L3: beats an open dashboard too
  #     when: "cpu.total_percent > 95 or load.avg_1m > cpu.count * 2"
  #     hold: 120
  #     storage_mb: 100
  #   - name: deep_sleep      # slower than L1 on a box that is truly idle
  #     interval: 1800
  #     priority: 5           # above L1 only; any anomaly or client wins
  #     when: "load.avg_1m < 0.05 and cpu.total_percent < 2"

# ---- Storage rings -------------------------------------------------------
storage:
  tier1_max_mb: 250        # raw L3 samples
  tier2_max_mb: 150        # 1-minute aggregates
  tier3_max_mb: 50         # 5-minute aggregates

# ---- Rules engine --------------------------------------------------------
# The engine is always Lua internally, but a `.yaml` / `.yml` rules file
# is auto-transpiled at load time for the common "simple thresholds"
# case. Format:
#   - name: high_cpu
#     when: "cpu.total_percent > 90"   # spliced verbatim into Lua
#     for_ticks: 5                     # consecutive hits before firing
#     cooldown: 10                     # ticks to wait after firing
#     severity: warning                # info / warning / critical
#     action: alert                    # alert | log
#     message: "CPU pegged"            # alert body; defaults to name
# Multi-line / computed thresholds → use a .lua file instead, the
# engine accepts both transparently.
rules:
  path: "/usr/local/etc/budyk/rules.lua"
  # Persist per-rule cooldown / fire counters across restarts so a
  # daemon bounce doesn't re-fire a rule that was mid-cooldown (which
  # would otherwise produce an alert-storm). State is flushed every 60s
  # and on graceful shutdown. Cooldown is stored as a tick count, so a
  # long downtime does not decrement it — erring toward "stay quiet".
  persist_state: true
  # Where to write the state. Empty ⇒ <data_dir>/rule_state.tsv.
  # state_path: "/var/db/budyk/rule_state.tsv"
  exec:
    enabled: false         # `true` lets watch() actions invoke external
                           # programs; otherwise exec() is rejected
    # When enabled, exec() will only spawn programs whose absolute path
    # is in this list. Empty list ⇒ any absolute path under the no-`..`
    # traversal guard.
    allow:
      - /usr/local/bin/budyk-alerter
      - /usr/bin/systemctl
  # How much a rule may run. Each call into Lua (a rule's `when` or
  # action, a custom level's `when`, the rules file being loaded) may
  # execute at most `instructions` VM instructions — about 10 ms at
  # the default — and the whole engine may hold at most `memory_mb`.
  # A rule that overruns gets an error logged once and is skipped on
  # that tick; the other rules and the daemon carry on. This is what
  # stops a `while true do end` typo from halting collection.
  limits:
    instructions: 1000000  # 10000 .. 1000000000
    memory_mb: 16          # 1 .. 1024
  freeze:
    enabled: false         # `true` lets watch() actions call freeze(pid)
                           # / unfreeze(pid) to send SIGSTOP / SIGCONT;
                           # otherwise both bindings raise an error.
    # When the list is non-empty, freeze() / unfreeze() will only signal
    # a process whose kernel-reported name (`comm`) matches one entry.
    # Empty list ⇒ no name-based gate (the engine-wide enabled flag
    # still applies).
    allow:
      - nginx
      - redis-server

# ---- Alert channels (rules can call alert(name, severity, message)) -----
# Each channel is a separate notification destination. The dispatcher
# fires every channel best-effort: a failed channel logs to stderr and
# the rest keep going. Channel `type` selects the backend; the other
# fields are interpreted per backend (see comments below).
#
# alerts:
#   channels:
#     # ntfy.sh — POST <url>/<topic>, plain-text body.
#     - name:  ops-ntfy
#       type:  ntfy
#       url:   "https://ntfy.sh"
#       topic: "budyk-alerts"
#
#     # Discord — POST to the full webhook URL with a JSON embed.
#     - name:  ops-discord
#       type:  discord
#       url:   "https://discord.com/api/webhooks/XXX/YYY"
#
#     # Telegram Bot API — sendMessage on the bot's token; chat_id can
#     # be a numeric id, a "-100…" channel id, or a "@channelname".
#     - name:  ops-telegram
#       type:  telegram
#       token: "1234567890:AA..."
#       topic: "-1001234567890"
#
#     # SMTP — curl smtp[s]://host:port, RFC822 body composed in-process.
#     # `token` is "user:pass" (basic auth) — omit for an unauthenticated
#     # relay. Quote the hash because it contains `$`.
#     - name:  ops-mail
#       type:  smtp
#       url:   "smtps://smtp.example.com:465"
#       from:  "alerts@example.com"
#       topic: "oncall@example.com"
#       token: "alerts@example.com:hunter2"
#
#     # Twilio SMS — POST to the /Messages.json endpoint of an account.
#     # `token` is "AccountSID:AuthToken" (HTTP basic). `from` and
#     # `topic` are E.164 phone numbers ("+15551234567").
#     - name:  ops-sms
#       type:  twilio
#       url:   "https://api.twilio.com/2010-04-01/Accounts/AC.../Messages.json"
#       token: "AC...:auth_token"
#       from:  "+15551234567"
#       topic: "+15559876543"

# ---- Security ------------------------------------------------------------
# File-change watcher (inotify on Linux, kqueue on FreeBSD). Each path
# is checked on every tick; events surface as the `files` Lua global
# with per-path counters and a tick-scoped `tampered` flag:
#   files["/etc/sudoers"].modifies   (number — cumulative)
#   files["/etc/sudoers"].deletes    (number — cumulative)
#   files["/etc/sudoers"].tampered   (bool   — true iff the path
#                                     fired any event this tick)
#
# Rule example:
#   watch("sudoers_tamper", {
#     when    = function()
#                 local f = files["/etc/sudoers"]
#                 return f and f.tampered
#               end,
#     action  = function() alert("sudoers_tamper", "critical",
#                                "/etc/sudoers modified") end,
#     cooldown = 60,
#   })
#
# security:
#   file_watch:
#     enabled: false
#     paths:
#       - /etc/sudoers
#       - /etc/passwd
#       - /etc/crontab

# ---- Web server / SPA ----------------------------------------------------
web:
  auth:
    enabled: false
    # IMPORTANT — wrap the hash in quotes. The PHC string contains
    # `$`, `,` and `=`, which YAML's flow style would treat as
    # separators / map keys. Block style (no `{}`) handles it without
    # quotes too, but quoting is the safe form.
    # Generate via:  budyk hash-password
    # password_hash: "$argon2id$v=19$m=65536,t=3,p=4$<salt>$<hash>"
    # Failed logins are throttled per client address: after
    # max_login_failures failures within login_window seconds, further
    # attempts from that address get HTTP 429 (no password hash is
    # computed) until the window ends. A successful login clears it.
    max_login_failures: 5
    login_window: 60       # seconds
    #
    # Persist logged-in sessions to <data_dir>/sessions.tsv (mode 0600)
    # so a daemon restart doesn't bounce every browser to the login
    # screen. The file holds live bearer tokens — keep data_dir locked
    # down. Set false to keep sessions RAM-only (logout-on-restart).
    persist_sessions: true
