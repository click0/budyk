# budyk — example configuration
# https://github.com/click0/budyk
#
# Copy to /usr/local/etc/budyk/config.yaml (FreeBSD) or
# /etc/budyk/config.yaml (Linux) and edit. Pass an alternative
# path via `budyk serve --config /path/to/config.yaml`.

# ---- Server ---------------------------------------------------------------
listen: "127.0.0.1"        # 0.0.0.0 to bind every interface
port: 8080
data_dir: "/var/db/budyk"  # ring files + (future) exports

# ---- Collection cadence (spec §3.3) --------------------------------------
collection:
  l1:
    interval: 300          # heartbeat — seconds
  l2:
    interval: 30
    always_on: false       # `true` keeps the watchful tier alive without
                           # an active client / anomaly
    hysteresis: 300        # seconds before stepping down a level
    escalation_thresholds:
      load_1m: 4.0
      cpu_percent: 85
      swap_used_percent: 50
  l3:
    interval: 1            # active — seconds
    grace_period: 60       # how long to keep L3 after the last client
                           # disconnects
  hot_buffer:
    capacity: 300          # records held in RAM for WS catch-up
    warm_grace: 60         # seconds

# ---- Storage rings -------------------------------------------------------
storage:
  tier1_max_mb: 250        # raw L3 samples
  tier2_max_mb: 150        # 1-minute aggregates
  tier3_max_mb: 50         # 5-minute aggregates

# ---- Rules engine --------------------------------------------------------
rules:
  path: "/usr/local/etc/budyk/rules.lua"
  exec:
    enabled: false         # `true` lets watch() actions invoke external
                           # programs; otherwise exec() is rejected
    # When enabled, exec() will only spawn programs whose absolute path
    # is in this list. Empty list ⇒ any absolute path under the no-`..`
    # traversal guard.
    allow:
      - /usr/local/bin/budyk-alerter
      - /usr/bin/systemctl

# ---- Web server / SPA ----------------------------------------------------
web:
  auth:
    enabled: false
    # IMPORTANT — wrap the hash in quotes. The PHC string contains
    # `$`, `,` and `=`, which YAML's flow style would treat as
    # separators / map keys. Block style (no `{}`) handles it without
    # quotes too, but quoting is the safe form.
    # Generate via:  budyk hash-password
    # password_hash: "$argon2id$v=19$m=65536,t=3,p=4$<salt>$<hash>"
